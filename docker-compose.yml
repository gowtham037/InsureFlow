services:
  db:
    image: postgres:16-alpine
    container_name: insureflow-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-insureflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-insureflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - insureflow-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: insureflow-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-insureflow}
      - ENVIRONMENT=production
      - DATA_GEN_SEED=20261022
      - AUTO_SEED_ON_STARTUP=true
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/runtime_exports:/app/data/runtime_exports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - insureflow-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: insureflow-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - insureflow-network

volumes:
  postgres_data:
    name: insureflow_postgres_data
    driver: local

networks:
  insureflow-network:
    name: insureflow-network
    driver: bridge
